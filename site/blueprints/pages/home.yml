# Each page blueprint must have a title, the title may be different from the file name
title: Home

# Each page can have an icon that is shown in page listings when no preview image is available.
icon: 🏠

tabs:
  content:
    label: content
    icon: text
    fields:
      hero:
        label: hero
        type: blocks
        empty: leer
        max: 1
        fieldsets:
          - heading
      blocks:
        label:
          en: Blocks
          de: Blöcke
        type: blocks
        fieldsets:
          text:
            label: Text
            type: group
            fieldsets:
              - intro
              - heading
              - text
              - list
              - quote
              - line
          media:
            label:
              de: Medien
              en: Media
            type: group
            fieldsets:
              - image
              - gallery
              - video